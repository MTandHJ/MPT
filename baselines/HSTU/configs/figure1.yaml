root: ../../data
dataset: Amazon2014Beauty_550_LOU
tasktag: NEXTITEM

maxlen: 50
num_heads: 2
num_blocks: 4
embedding_dim: 64
linear_hidden_dim: 4
attention_dim: 4
emb_dropout_rate: 0.4
hidden_dropout_rate: 0.1

epochs: 300
batch_size: 256
optimizer: AdamW
lr: 1.e-3
weight_decay: 0.
num_negs: 512
temperature: 0.1
num_buckets: 128

monitors: [LOSS, HitRate@1, HitRate@10, HitRate@20, NDCG@10, NDCG@20]
which4best: NDCG@10